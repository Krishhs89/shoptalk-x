# ShopTalk-X pipeline configuration

data:
  base_url: "https://amazon-berkeley-objects.s3.amazonaws.com"
  listings_shards: ["listings_0.json.gz", "listings_1.json.gz"]   # ~9.2k products/shard, ~7.7k English each; 2 shards -> sample down to target_product_count
  images_metadata: "images/metadata/images.csv.gz"
  images_prefix: "images/small"             # 256px catalog images
  language_tag: "en_US"                     # ABO listings are multilingual; we standardize on English
  target_product_count: 10000
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  seed: 42

embeddings:
  text_model: "data/models/bge-finetuned"   # fine-tuned on this catalog's golden set; falls back conceptually to BAAI/bge-base-en-v1.5 if this dir is ever removed -- see docs
  batch_size: 64
  device: "auto"        # "cuda" | "mps" | "cpu" | "auto"
  chroma_dir: "data/chroma"
  collection_name: "shoptalk_products"

captioning:
  model: "Salesforce/blip-image-captioning-base"
  batch_size: 16
  device: "auto"
  max_new_tokens: 30

clip:
  model_name: "ViT-B-32"
  pretrained: "laion2b_s34b_b79k"    # OpenCLIP (LAION), per design doc §12.1
  batch_size: 32
  device: "auto"
  chroma_dir: "data/chroma"
  collection_name: "shoptalk_images"

retrieval:
  top_k: 10
  stage1_k: 100          # ANN candidates handed to the reranker
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_batch_size: 64
  image_stage1_k: 50     # CLIP-ANN candidates handed to the image-query reranker

cache:
  enabled: true
  similarity_threshold: 0.93   # calibrated against real bge-base-en-v1.5 query embeddings -- see api/semantic_cache.py
  ttl_seconds: 600
  max_entries: 500

eval:
  golden_set_path: "data/eval/golden_set.jsonl"
  golden_set_size: 100
  seed: 42
  results_dir: "results"

mlflow:
  tracking_uri: "file:./mlruns"   # override with MLFLOW_TRACKING_URI, e.g. http://localhost:5000 (docker-compose)
  experiment_name: "shoptalk-x-retrieval"

llm:
  provider: "ollama"
  model: "llama3.1:8b-instruct-q4_0"
  base_url: "http://localhost:11434"   # override with OLLAMA_BASE_URL (e.g. http://ollama:11434 in docker-compose)
  temperature: 0.2
  num_predict: 400          # max generated tokens
  conversation_max_turns: 6  # prior (user, assistant) turns kept in the prompt
  context_products: 8        # how many reranked hits get passed to the LLM as context

verification:
  embedding_model: "BAAI/bge-base-en-v1.5"   # reuse the text encoder's image-agnostic... see verification/README note
  clip_model_name: "ViT-B-32"
  clip_pretrained: "laion2b_s34b_b79k"
  pairs_path: "data/verification/pairs.jsonl"
  model_path: "data/verification/mlp_head.pt"
  device: "auto"
  threshold: 0.5             # decision boundary tuned in train_verification.py, stored alongside the model
  hidden_dim: 128
  epochs: 15
  lr: 0.001
  batch_size: 32
  seed: 42

personalization:
  interactions_path: "data/personalization/interactions.jsonl"
  num_synthetic_users: 50
  decay: 0.7                 # per-interaction recency decay for the user profile vector
  alpha: 0.7                 # final_score = alpha * cross-encoder + beta * profile-cosine
  beta: 0.3

voice:
  stt_model: "base"          # faster-whisper model size
  device: "auto"
