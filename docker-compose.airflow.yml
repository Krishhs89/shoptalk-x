# Local Airflow demo for the retraining DAG (design doc §7.3, simplified per
# the execution plan to a single DAG run standalone -- not a production
# multi-node Airflow deployment).
#
# Usage:
#   docker compose -f docker-compose.airflow.yml up --build
#   open http://localhost:8080 (user: airflow, printed to logs on first boot)
#   trigger `shoptalk_x_retrain_embeddings` from the UI, or:
#   docker compose -f docker-compose.airflow.yml exec airflow \
#     airflow dags trigger shoptalk_x_retrain_embeddings
#
# `airflow standalone` bundles the scheduler + webserver + a SQLite metadata
# db (SequentialExecutor) in one process -- the right amount of
# infrastructure for demoing one linear DAG locally; a real deployment would
# use LocalExecutor/CeleryExecutor + Postgres instead.
services:
  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/shoptalk/data
      - airflow-metadata:/opt/airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Port 5001, not 5000 -- this repo's own docker-compose.yml publishes
      # MLflow on host port 5001 (5000 collides with macOS's AirPlay
      # Receiver on a Mac; kept consistent across environments rather than
      # branching the port by OS).
      MLFLOW_TRACKING_URI: "http://host.docker.internal:5001"
      # Makes CUDA invisible to every process in this container, container-wide,
      # rather than relying on every individual script to remember to pass
      # device="cpu". Real failure on a shared GPU host (the EC2 g4dn.xlarge
      # that also runs the serving stack): the DAG's rebuild_golden_set task
      # calls into shoptalk.retrieval.search's model loader -- same code path
      # the live API uses -- which has no device argument and defaults to
      # grabbing CUDA. With Ollama and the API's own CLIP/BLIP/reranker models
      # already resident on the same 16GB T4, that was enough contention to
      # hang the whole instance (SSHD stopped responding, needed a hard
      # reboot) even with finetune_text.py's own --device cpu fix already in
      # place -- that fix only covered two of the DAG's several model-loading
      # call sites, not all of them. This is the container-wide version of the
      # same fix: nothing in here can see a GPU, full stop, regardless of
      # which script forgets to ask for CPU explicitly.
      CUDA_VISIBLE_DEVICES: ""
      # Caps PyTorch's CPU intra-op parallelism. Unset, it defaults to one
      # thread per host core; combined with the HF Trainer path
      # finetune_text.py goes through (see that module's own notes), this
      # was observed spiking the container to 11.77GB RSS and taking the
      # WHOLE EC2 HOST down (not just this container) -- the host had no
      # swap configured, so once physical memory ran out there was nowhere
      # left to go and the box became fully unresponsive, requiring a hard
      # reboot. A host-level swap file is now in place as a general safety
      # net (see docs/deployment/aws_ec2.md), and mem_limit below caps this
      # specific container so a runaway task gets OOM-killed and can be
      # retried, instead of ever repeating that host-wide hang.
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    # host.docker.internal only resolves automatically on Docker Desktop
    # (Mac/Windows); native Linux Docker Engine (e.g. this project's EC2
    # deployment) needs this extra_hosts entry to route it to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hard cap so a memory spike here (see OMP_NUM_THREADS note above) gets
    # contained to an OOM-killed container -- Airflow's default_args.retries
    # then retries the task -- rather than exhausting host memory and
    # hanging the whole EC2 instance.
    mem_limit: "6g"
    command: standalone

volumes:
  airflow-metadata:
